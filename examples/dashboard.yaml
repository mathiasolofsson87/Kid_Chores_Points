# =====================================================================
#  KID CHORES & POINTS – example dashboard
#
#  Paste into a new dashboard:
#   Settings -> Dashboards -> Add dashboard -> "New dashboard from
#   scratch" -> open it -> ⋮ -> Raw configuration editor -> replace all.
#
#  >>> EDIT <<<
#   1. The Kid Chores & Points cards find the tracker by themselves; with
#      several children, pick the tracker in each card's editor. Only the
#      to-do list and logbook in the Parents view use entity ids, which
#      assume the tracker is named "Chores" (e.g. sensor.chores_points_bank).
#      If you named it differently, find & replace "chores_" with your
#      tracker's slug (Settings -> Devices & services -> Kid Chores & Points).
#   2. Rewards are shown by the built-in kid-chores-rewards-card; with
#      several trackers, pick the tracker in the card editor.
#   3. In Maintenance Supporter, label the mandatory tasks "mandatory" and
#      the bonus tasks "bonus" (used by the maintenance-supporter-card).
#      Remove those cards if you complete chores another way.
#   4. Replace PARENT_USER_ID_1/2 with your HA user ids
#      (Settings -> People -> Users -> open user -> ID).
#   5. On the child's account: Profile -> Dashboard -> pick this one.
# =====================================================================
title: My chores
views:
  # -------------------------------------------------------------------
  #  Child view
  # -------------------------------------------------------------------
  - title: Today
    path: today
    icon: mdi:star-face
    type: sections
    max_columns: 3
    sections:
      # ---------------- Status ----------------
      # Built into the integration (pick the tracker in the card editor).
      - type: grid
        cards:
          - type: custom:kid-chores-status-card
            # Optional shortcut chips; `users` limits who sees a chip.
            # chips:
            #   - {icon: "mdi:shield-account", label: Parents, navigation_path: parents, users: [PARENT_USER_ID_1]}

      # ---------------- Daily (mandatory) ----------------
      - type: grid
        cards:
          - type: heading
            heading: To do today
            icon: mdi:format-list-checks
          - type: markdown
            content: >
              {%- set s = 'sensor.chores_mandatory_chores_remaining' %}
              {%- set done = state_attr(s, 'done') or [] %}
              {%- set left = state_attr(s, 'remaining') or [] %}
              {%- set pts = state_attr(s, 'mandatory_chores') or {} %}
              {%- for t in done %}
              ✅ ~~{{ t }}~~ (+{{ pts[t] }})
              {% endfor %}
              {%- for t in left %}
              ⬜ **{{ t }}** (+{{ pts[t] }})
              {% endfor %}
              {%- if left | count == 0 %}
              🎉 **All done for today – great job!**
              {%- endif %}
          - type: custom:maintenance-supporter-card
            show_header: false
            show_actions: true
            show_assignee: false
            compact: true
            filter_labels: [mandatory]
            visibility:
              - condition: state
                entity: binary_sensor.chores_mandatory_chores_complete
                state: "off"

      # ---------------- Bonus ----------------
      - type: grid
        cards:
          - type: heading
            heading: Bonus chores
            icon: mdi:star-plus
          - type: markdown
            content: >
              🔒 Bonus chores unlock when today's chores are done.
              {%- set p = states('sensor.chores_pending_bonus_points') | int(0) %}
              {%- if p > 0 %}<br>⏳ **{{ p }} bonus points** are waiting to be added!{% endif %}
            visibility:
              - condition: state
                entity: binary_sensor.chores_mandatory_chores_complete
                state: "off"
          - type: markdown
            content: >
              {%- set b = state_attr('sensor.chores_mandatory_chores_remaining', 'bonus_chores') or {} %}
              {%- for name, p in b.items() %}
              ⭐ {{ name }} – **+{{ p }}**
              {% endfor %}
            visibility:
              - condition: state
                entity: binary_sensor.chores_mandatory_chores_complete
                state: "on"
          - type: custom:maintenance-supporter-card
            show_header: false
            show_actions: true
            show_assignee: false
            compact: true
            filter_labels: [bonus]
            visibility:
              - condition: state
                entity: binary_sensor.chores_mandatory_chores_complete
                state: "on"

      # ---------------- Rewards ----------------
      # Built into the integration: lists the rewards you configured and
      # handles redeeming. No per-reward setup needed.
      - type: grid
        cards:
          - type: custom:kid-chores-rewards-card

  # -------------------------------------------------------------------
  #  Parent view (hidden from the child)
  # -------------------------------------------------------------------
  - title: Parents
    path: parents
    icon: mdi:shield-account
    type: sections
    visible:
      - user: PARENT_USER_ID_1
      - user: PARENT_USER_ID_2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Settings
          - type: button
            name: Chores, rewards, goal & notifications
            icon: mdi:cog
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /config/integrations/integration/kid_chores_points
          - type: custom:kid-chores-status-card
          # Add or deduct points in the bank or this week (use -5 to deduct)
          - type: custom:kid-chores-adjust-card
          # Timeline of every points change and why
          - type: custom:kid-chores-history-card
      - type: grid
        cards:
          - type: heading
            heading: Rewards to hand out
          # Entity id = todo.<tracker name>_redeemed_rewards
          - type: todo-list
            entity: todo.chores_redeemed_rewards
          - type: logbook
            target:
              entity_id:
                - sensor.chores_points_bank
                - sensor.chores_points_this_week
            hours_to_show: 168
