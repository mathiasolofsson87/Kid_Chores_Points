# =====================================================================
#  KID CHORES & POINTS – example dashboard
#
#  Paste into a new dashboard:
#   Settings -> Dashboards -> Add dashboard -> "New dashboard from
#   scratch" -> open it -> ⋮ -> Raw configuration editor -> replace all.
#
#  >>> EDIT <<<
#   1. The Kid Chores & Points cards find the tracker by themselves; with
#      several children, pick the tracker in each card's editor. Only the
#      to-do list and logbook in the Parents view use entity ids, which
#      assume the tracker is named "Chores" (e.g. sensor.chores_points_bank).
#      If you named it differently, find & replace "chores_" with your
#      tracker's slug (Settings -> Devices & services -> Kid Chores & Points).
#   2. Rewards (including cash-out rewards that pay into the wallet) are
#      shown by the built-in kid-chores-rewards-card; the wallet by the
#      kid-chores-wallet-card.
#   3. In Maintenance Supporter, label the mandatory tasks "mandatory" and
#      the bonus tasks "bonus" - the Chores to do / Bonus chores cards only
#      list tasks with those labels (change filter_labels on the cards to
#      use other labels).
#   4. Replace PARENT_USER_ID_1/2 with your HA user ids
#      (Settings -> People -> Users -> open user -> ID).
#   5. On the child's account: Profile -> Dashboard -> pick this one.
# =====================================================================
title: My chores
views:
  # -------------------------------------------------------------------
  #  Child view
  # -------------------------------------------------------------------
  - title: Today
    path: today
    icon: mdi:star-face
    type: sections
    max_columns: 3
    sections:
      # ---------------- Status ----------------
      # Built into the integration (pick the tracker in the card editor).
      - type: grid
        cards:
          - type: custom:kid-chores-status-card
            # Optional shortcut chips; `users` limits who sees a chip.
            # chips:
            #   - {icon: "mdi:shield-account", label: Parents, navigation_path: parents, users: [PARENT_USER_ID_1]}

      # ---------------- Daily (mandatory) ----------------
      - type: grid
        cards:
          # One chore per line with ticks, plus Done buttons for the matching
          # Maintenance Supporter tasks (label "mandatory").
          - type: custom:kid-chores-todo-card

      # ---------------- Bonus ----------------
      - type: grid
        cards:
          - type: heading
            heading: Bonus chores
            icon: mdi:star-plus
          # Always listed; bonus points are held (with a hint) until today's mandatory chores are done;
          # Done buttons for Maintenance Supporter tasks labelled "bonus".
          - type: custom:kid-chores-bonus-card

      # ---------------- Rewards ----------------
      # Built into the integration: lists the rewards you configured and
      # handles redeeming. No per-reward setup needed.
      - type: grid
        cards:
          - type: custom:kid-chores-rewards-card
          # The child's wallet: current money and recent activity.
          - type: custom:kid-chores-wallet-card

      # ---------------- Medals ----------------
      # Streaks and medals (turn them on under Configure -> Streaks & medals;
      # the card says so until you do).
      - type: grid
        cards:
          - type: custom:kid-chores-medals-card

  # -------------------------------------------------------------------
  #  Parent view (hidden from the child)
  # -------------------------------------------------------------------
  - title: Parents
    path: parents
    icon: mdi:shield-account
    type: sections
    visible:
      - user: PARENT_USER_ID_1
      - user: PARENT_USER_ID_2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Settings
          - type: button
            name: Chores, rewards, goal & notifications
            icon: mdi:cog
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /config/integrations/integration/kid_chores_points
          - type: custom:kid-chores-status-card
          # Add or deduct points (bank / this week) or money (wallet); use -5 to deduct
          - type: custom:kid-chores-adjust-card
          # Timeline of every points change and why
          - type: custom:kid-chores-history-card
      - type: grid
        cards:
          - type: heading
            heading: Rewards to hand out
          # Entity id = todo.<tracker name>_redeemed_rewards
          - type: todo-list
            entity: todo.chores_redeemed_rewards
          - type: logbook
            target:
              entity_id:
                - sensor.chores_points_bank
                - sensor.chores_points_this_week
                - sensor.chores_wallet
            hours_to_show: 168
